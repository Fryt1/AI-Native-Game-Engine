name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and lint dependencies
        run: python -m pip install --upgrade pip pytest ruff
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run lint
        run: ruff check src/ainative tests integrity_gate.py
      - name: Verify the Skill package is complete
        run: python integrity_gate.py --json
