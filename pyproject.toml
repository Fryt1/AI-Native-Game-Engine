[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-game-engine"
version = "0.1.0"
description = "Agent-authored Workflows with structured MCP call evidence and deterministic Stage acceptance."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ainative-session = "ainative.session:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
